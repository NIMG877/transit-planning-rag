<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>交通规划与政策智能问答助手</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="ambient-grid" aria-hidden="true"></div>
    <div class="blob blob-a" aria-hidden="true"></div>
    <div class="blob blob-b" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="hero">
        <p class="hero-kicker">Local RAG Workspace</p>
        <h1>交通规划与政策智能问答助手</h1>
        <p class="hero-subtitle">
          在本地完成“提问-检索-回答”闭环，支持向量检索、PathRAG 与 Hybrid 多路召回。
        </p>
      </header>

      <section id="workspace" class="workspace" aria-label="问答工作区">
        <section class="glass-card chat-panel">
          <div id="chat-history" class="chat-history" aria-live="polite">
            <section id="chat-empty" class="chat-empty">
              <h2>先试试这些问题</h2>
              <p>发送第一条问题后，这里会显示完整多轮问答记录。</p>
              <div class="quick-questions" id="quick-questions" aria-label="快捷问题"></div>
            </section>
          </div>

          <form id="chat-form" class="composer" autocomplete="off">
            <div id="settings-popover" class="settings-popover hidden" role="dialog" aria-label="问答设置">
              <h3>问答设置</h3>

              <label class="field" for="mode">
                <span>问答模式</span>
                <select id="mode" name="mode">
                  <option value="vector">Vector RAG</option>
                  <option value="pathrag">PathRAG</option>
                  <option value="hybrid">Hybrid Multi-Recall</option>
                </select>
              </label>

              <label class="field" for="top-k">
                <span>召回数量 Top-K</span>
                <div class="range-wrap">
                  <input id="top-k" name="top-k" type="range" min="1" max="10" value="3" />
                  <output id="top-k-output" for="top-k">3</output>
                </div>
              </label>
            </div>

            <label class="sr-only" for="question">你的问题</label>
            <textarea
              id="question"
              name="question"
              rows="3"
              placeholder="例如：十四五期间上海综合交通发展的总体思路是什么？"
              required
            ></textarea>

            <div class="composer-actions">
              <button
                id="settings-btn"
                class="icon-btn settings-btn"
                type="button"
                aria-expanded="false"
                aria-controls="settings-popover"
                aria-label="打开设置"
                title="设置"
              >
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M10.9 2.9a1.5 1.5 0 0 1 2.2 0l.9 1a8 8 0 0 1 1.8.8l1.3-.4a1.5 1.5 0 0 1 1.9 1.1l.3 1.4a8 8 0 0 1 1.3 1.4l1.3.2a1.5 1.5 0 0 1 1.2 1.8l-.3 1.4a8 8 0 0 1 0 1.7l.3 1.4a1.5 1.5 0 0 1-1.2 1.8l-1.3.2a8 8 0 0 1-1.3 1.4l-.3 1.4a1.5 1.5 0 0 1-1.9 1.1l-1.3-.4a8 8 0 0 1-1.8.8l-.9 1a1.5 1.5 0 0 1-2.2 0l-.9-1a8 8 0 0 1-1.8-.8l-1.3.4a1.5 1.5 0 0 1-1.9-1.1l-.3-1.4a8 8 0 0 1-1.3-1.4l-1.3-.2a1.5 1.5 0 0 1-1.2-1.8l.3-1.4a8 8 0 0 1 0-1.7l-.3-1.4a1.5 1.5 0 0 1 1.2-1.8l1.3-.2a8 8 0 0 1 1.3-1.4l.3-1.4a1.5 1.5 0 0 1 1.9-1.1l1.3.4a8 8 0 0 1 1.8-.8l.9-1Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linejoin="round"
                  />
                  <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4" />
                </svg>
              </button>
              <button id="submit-btn" class="icon-btn submit-btn" type="submit" aria-label="发送" title="发送">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 12h13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  <path
                    d="M13 6l7 6-7 6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </form>
        </section>

        <aside id="details-panel" class="glass-card details-panel hidden" aria-live="polite">
          <div class="panel-head">
            <div class="badges">
              <span id="badge-mode" class="badge">模式：-</span>
              <span id="badge-category" class="badge">分类：-</span>
            </div>
            <button
              id="details-toggle"
              class="icon-btn close-btn"
              type="button"
              aria-label="关闭详情"
              title="关闭详情"
            >
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
          </div>

          <div class="details-content">
            <section id="entities-block" class="meta-block hidden">
              <h3>识别实体</h3>
              <ul id="entities-list" class="chip-list"></ul>
            </section>

            <section id="paths-block" class="meta-block hidden">
              <h3>路径证据</h3>
              <ul id="paths-list" class="trace-list"></ul>
            </section>

            <section id="docs-block" class="meta-block hidden">
              <h3>文本证据片段</h3>
              <ul id="docs-list" class="doc-list"></ul>
            </section>
          </div>
        </aside>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
