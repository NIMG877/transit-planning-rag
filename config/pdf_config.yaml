# PDF 配置 schema
# 依据 scripts/ingestion/pdf_reader.py 的处理流程定义，用于规范后续新增配置。
# 1. 每个条目表示一个 PDF 文档处理配置。
# 2. pages 支持 None、int、[start,end]、[[s1,e1],[s2,e2],...]。
# 3. rules 定义清洗规则，extract_tables 与 table_settings 用于表格提取。
#
# - pdf_path: string          # PDF 文件路径，支持相对路径或绝对路径
#   year: int                 # 文档年份，用于 metadata header
#   publisher: string         # 发布单位，用于 metadata header
#   doc_type: string          # 文档类型，用于 metadata header
#   pages:                    # 要提取的页码范围，1-based
#     # 可选值：
#     # None              -> 全部页面
#     # 5                 -> 5 页到末尾
#     # [3, 7]            -> 第 3 页到第 7 页
#     # [[1, 3], [10, 12]] -> 多个区间
#   rules:
#     header_pattern: string?         # 删除页眉正则，支持 multiline
#     footer_pattern: string?         # 删除页脚正则
#     page_number_pattern: string?    # 删除页码正则
#     merge_line_breaks: boolean?     # 合并换行，保留段落语义
#     remove_special_chars: boolean?  # 删除特殊字符，只保留中英文、数字、标点
#     extra_patterns:                 # 额外正则替换列表
#       - pattern: string
#         replacement: string?        # 默认为空字符串
#   extract_tables: boolean?          # 是否提取表格内容，默认 false
#   table_settings:                   # pdfplumber 的表格提取设置，可选
#     vertical_strategy: string?
#     horizontal_strategy: string?
#     snap_tolerance: number?
#     intersection_tolerance: number?
#     explicit_vertical_lines:       # 纵向显式线坐标列表
#       - number
#     explicit_horizontal_lines:     # 横向显式线坐标列表
#       - number
#     edge_min_length: number?
#     min_words_vertical: number?
#     min_words_horizontal: number?
#     keep_blank_chars: boolean?
#     text_tolerance: number?
#     text_x_tolerance: number?
#     text_y_tolerance: number?
#
# 示例：
# - pdf_path: ../files/example.pdf
#   year: 2024
#   publisher: "上海市交通委员会"
#   doc_type: "政策文件"
#   pages: [1, 25]
#   rules:
#     merge_line_breaks: true
#     remove_special_chars: false
#     extra_patterns:
#       - pattern: "\\n\\d+\\n"
#         replacement: "\\n"
#   extract_tables: true
#   table_settings:
#     vertical_strategy: "lines"
#     horizontal_strategy: "lines"

- pdf_path: ../files/2022_上海市交通发展白皮书.pdf
  year: 2022
  publisher: "上海市交通委员会"
  doc_type: "白皮书"
  pages: [6, 66]
  rules:
    header_pattern: "\\n-\\d+-"
    extra_patterns:
      - pattern: "\\s+\\d+$"
        replacement: ""
      - pattern: "^\\s*\\d+\\s*$"
        replacement: ""
      - pattern: "1 30分钟内部通勤并联系周边中心镇，45分钟到达近沪城市、中心城和相邻新城，60分钟衔接国际枢纽。\\n2都市区1小时通勤、城市群2小时通达、全国主要城市3小时覆盖。\\n3国内1天送达、周边国家2天送达、全球主要城市3天送达。"
        replacement: ""
    merge_line_breaks: true
    remove_special_chars: false

- pdf_path: ../files/上海市城市总体规划（2017-2035年）.pdf
  year: 2018
  publisher: "上海市人民政府"
  doc_type: "总体规划"
  pages: [[3, 7], [11, 121]]
  rules:
    merge_line_breaks: true
    remove_special_chars: false
    extra_patterns:
      - pattern: "\\n\\d+\\n"
        replacement: "\\n"
      - pattern: "（见表\\d+-\\d+）"
        replacement: ""
      - pattern: "(见表\\d+-\\d+)"
        replacement: ""
      - pattern: "见表\\d+-\\d+"
        replacement: ""

- pdf_path: ../files/上海市综合交通发展“十四五”规划.pdf
  year: 2021
  publisher: "上海市人民政府"
  doc_type: "发展规划"
  pages: [1,30]
  rules:
    merge_line_breaks: true
    remove_special_chars: false

- pdf_path: ../files/推进本市公共交通高质量发展的指导意见.pdf
  year: 2025
  publisher: "上海市交通委员会"
  doc_type: "指导意见"
  pages: [1, 4]
  rules:
    merge_line_breaks: true

- pdf_path: ../files/上海市轨道交通规划建设回顾与展望.pdf
  year: 2025
  publisher: "中国城市规划网"
  doc_type: "会议报告"
  pages: [1, 4]
  rules:
    merge_line_breaks: true
